submission:
  title: "SupplyGuard AI"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply-chain operations teams need to identify at-risk shipments quickly, understand the
    evidence behind risk, connect disruptions to affected shipments, and determine whether
    fleet capacity is available. These signals are distributed across operational records,
    slowing triage and making decisions difficult to trace.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    SupplyGuard AI is a read-only logistics control center built with a React dashboard and
    Express/Mongoose API over synthetic MongoDB data. It combines deterministic shipment-risk
    analysis with disruption, fleet, and cold-chain evidence so operators can prioritize review.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Explainable deterministic shipment risk scoring with LOW, MEDIUM, HIGH, and CRITICAL levels"
    - "Operations dashboard for shipment KPIs, disruptions, fleet utilization, and cold-chain alerts"
    - "Evidence-linked shipment, disruption, vehicle, and temperature detail views"
    - "Provider-neutral grounded assistant contract with validated structured responses"
    - "Read-only, bounded MCP-style tool adapter for future transport integration"

  tech_stack:
    languages: ["JavaScript"]
    frameworks: ["React", "Express", "Vite", "Tailwind CSS", "Mongoose"]
    ibm_technologies: ["IBM Bob"]
    databases: ["MongoDB"]
    other: ["GitHub Actions", "Helmet", "express-rate-limit"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The strongest part is the traceable, deterministic risk workflow: the dashboard moves from
    a network KPI to shipment evidence, disruption and sensor context, fleet capacity, and a
    manual-review recommendation without fabricating operational actions.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The dataset is synthetic. Runtime AI is disabled by default and no external provider adapter
    or MCP transport is included. The shared API key is MVP service-level authentication rather
    than tenant or role authorization, and the Disruptions navigation route is currently a
    placeholder while live disruption cards are available on Overview.

